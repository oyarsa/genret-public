[project]
name = "genret"
version = "0.1.0"
description = "S2ORC paper processing toolkit"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "beartype>=0.22.9",
    "httpx>=0.28.1, <1",
    "matplotlib>=3.10.7",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "onnxruntime>=1.20",
    "openai>=2.16.0",
    "plotly>=6.5.0",
    "plotly-stubs>=0.0.6",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
    "scipy>=1.17.1",
    "socksio>=1.0.0",
    "tiktoken>=0.12.0",
    "tokenizers>=0.21.0",
    "tqdm>=4.67.1",
    "typer>=0.20.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "rank-bm25>=0.2.2",
    "backoff>=2.2.1",
    "pymupdf4llm",
    "rapidfuzz>=3.14.5",
]

[project.scripts]
genret = "genret.cli:main"
graft = "genret.explorer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "onnx>=1.17",
    "pytest>=9.0.2",
    "ruff>=0.14.8",
    "pytest-asyncio>=1.3.0",
    "pyrefly==0.56.0",  # exact: 1.x changes defaults (122 new errors); bump deliberately
    "scipy-stubs>=1.17.1.0",
    "pytest-xdist>=3.8.0",
    "pdoc>=16.0.0",
    "spacy>=3.8.13",
]

[project.optional-dependencies]
cpu = ["torch>=2.10.0", "sentence-transformers>=3.0.0"]
cuda = ["torch>=2.10.0", "sentence-transformers>=3.0.0"]
training = [
    "transformers>=4.58",
    "peft>=0.15.1",
    "bitsandbytes>=0.45.3 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "accelerate>=0.25.0",
    "scikit-learn>=1.4.0",
    "protobuf>=7.34.0",
    "sentencepiece>=0.2.1",
    "einops>=0.7.0",
    "spacy>=3.8.13",
    "en-core-web-sm",
    "leidenalg>=0.10.0",
    "python-igraph>=0.11.0",
]


[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cuda" },
]
pdoc = { git = "https://github.com/oyarsa/pdoc", tag = "v16.1.0" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff",
    # SWIG-generated bindings in sentencepiece (pulled in by transformers) emit
    # this on Python 3.12+; third-party, not actionable in our code.
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
# I try to enable as many reasonable rules as possible, but sometimes it's too much:
ignore = [
    "FIX",      # Allow FIX/TODO/XXX comments.
    "TD",       # Allow TODO comments without author/link
    "COM",      # Let ruff take care of trailing commas
    "T",        # Allow print
    "FLY",      # Allow static string joins
    "FBT",      # Allow positional boolean arguments
    "EM",       # Exception messages with literals/f-strings
    "A",        # Allow shadowing built-ins
    "ARG",      # Allow unused arguments
    "BLE",      # Allow blind excepts
    "PLR",      # "Too many" warnings
    #
    "ANN401",   # Allow usage of Any
    "B905",     # `zip` without `strict`
    "C901",     # "too complex" functions
    "D107",     # Allow no docstring in __init__
    "D202",     # Empty lines between function docstring and body
    "E501",     # Line too long (let ruff format take care of this)
    "G004",     # f-strings in logging
    "ISC001",   # Incompatible with the formatter
    "PERF401",  # Manual list comprehensions
    "PERF203",  # Allow try/except inside loops
    "PGH003",   # Allow blanket type: ignore statements
    "PLC0206",  # Dictionary iteration without items
    "PLC0414",  # Allow redundant alias to re-export items
    "PTH123",   # Allow `open(p)` instead of `Path(p).open`
    "RET505",   # Allow `else` after `return`. I like this symmetry in some cases.
    "RET504",   # Allow 'unnecessary' assignment before return.
    "S101",     # Allow assert
    "S311",     # Allow regular `random.Random` (not crypto safe, but that's fine)
    "S603",     # Allow subprocess with 'untrusted' input
    "S607",     # Allow subprocess with relative path (usually `uv run`)
    "SIM108",   # Use ternary operation instead of if-else block
    "TC",       # PEP 649 (Python 3.14) makes TYPE_CHECKING guards unnecessary for
                # annotation-only imports. Keep heavy guards (transformers, etc.) by
                # choice, but don't lint for them.
    "TRY003",   # Long messages outside exception class
    "INP001",   # Disable annoying error about implicit namespaces
    "TRY301",   # Enable raise inside try/except
    "PYI025",   # Allow `collections.abc.Set` without aliasing to `AbstractSet`
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["SLF001"]  # Allow private member access in tests

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
# Ruff also handles this, and it needs to be enabled there for fixAll to fix it,
# so we disable it here to avoid duplicate errors
reportUnusedImport = false
typeCheckingMode = "strict"
# Allow unit tests to import private things
executionEnvironments = [
  { root = "tests", reportPrivateUsage = false }
]
exclude = [
    "**/__pycache__",
    "**/.*",
    "notebooks/",
    "frontend/",
    "tmp/"
]

[tool.mypy]
strict = true
warn_unreachable = true
strict_equality_for_none = true
local_partial_types = true
disable_error_code = [
    "no-redef",
    "redundant-cast",
    "no-any-return",
    "no-untyped-call",
    "redundant-cast",
    # False positives on torch.Tensor (https://github.com/zubanls/zuban/issues/344)
    "name-defined",
    "attr-defined",
]

[tool.pyrefly]
infer-with-first-use = false
search-path = ["tests"]

[tool.pyrefly.errors]
missing-attribute = "error"
implicit-abstract-class = "error"
implicit-any = "error"
implicitly-defined-attribute = "error"
missing-override-decorator = "error"
not-required-key-access = "error"
open-unpacking = "error"
unannotated-attribute = "error"
unannotated-parameter = "error"
unannotated-return = "error"
untyped-import = "error"
unused-ignore = "error"
variance-mismatch = "error"

[[tool.pyrefly.sub-config]]
matches = "src/genret/_shed"

[tool.pyrefly.sub-config.errors]
implicit-any = "ignore"
untyped-import = "ignore"

[[tool.pyrefly.sub-config]]
matches = "tests"

[tool.pyrefly.sub-config.errors]
no-access = "ignore"

[tool.ty.rules]
ambiguous-protocol-member = "error"
ineffective-final = "error"
invalid-enum-member-annotation = "error"
invalid-legacy-positional-parameter = "error"
possibly-missing-implicit-call = "error"
possibly-missing-submodule = "error"
redundant-cast = "error"
redundant-final-classvar = "error"
undefined-reveal = "error"
unresolved-global = "error"
unsupported-base = "error"
unsupported-dynamic-base = "error"
unused-awaitable = "error"
unused-type-ignore-comment = "ignore"
useless-overload-body = "error"
